name: PHP Composer

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  supported:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: [ '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5' ]
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer, phpunit:9
      - name: Validate composer.json
        run: composer validate --no-check-lock
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      - name: Install PHPUnit
        run: composer require --dev --no-update phpunit/phpunit:^9
      - name: Update PHPUnit dependencies
        run: composer update phpunit/phpunit --with-dependencies --prefer-dist --no-progress
      - name: Run PHPUnit
        run: vendor/bin/phpunit --no-configuration --bootstrap vendor/autoload.php tests

  legacy-probe:
    name: Legacy probe PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '7.0'
            phpunit-version: '6'
          - php-version: '7.1'
            phpunit-version: '7'
          - php-version: '7.2'
            phpunit-version: '8'
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2, phpunit:${{ matrix.phpunit-version }}
      - name: Validate composer.json
        run: composer validate --no-check-lock
      - name: Check dependency compatibility
        run: composer update --prefer-dist --no-progress
      - name: Run PHPUnit compatibility probe
        run: phpunit --no-configuration --bootstrap vendor/autoload.php tests

  future-probe:
    name: Future probe PHP 8.6
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.6'
          tools: composer, phpunit
      - name: Validate composer.json
        run: composer validate --no-check-lock
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      - name: Run PHPUnit compatibility probe
        run: phpunit --no-configuration --bootstrap vendor/autoload.php tests
